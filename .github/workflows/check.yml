name: Package checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['24.0.0', '24', '26']
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Install Appium host regression dependencies
        run: npm ci --prefix .scratch/appium-mcp-migration/candidate-stack
      - run: npm run check
      - name: Native observation host regressions
        run: python3 -W error::ResourceWarning -m unittest discover -s spikes/native-owner/host -p 'test_*.py' -v
      - name: Startup container diagnostic regression
        run: python3 -W error::ResourceWarning .scratch/native-owner-recovery/startup-probe/test_observe.py -v
      - name: Mandatory clean installed observed CLI/MCP and plugin proof
        run: node tests/fixtures/observed-packaging/proof.mjs
      - run: npm pack --dry-run
