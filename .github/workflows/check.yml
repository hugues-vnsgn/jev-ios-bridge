name: Package checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Native observation host regressions
        run: python3 -W error::ResourceWarning -m unittest discover -s spikes/native-owner/host -p 'test_*.py' -v
      - name: Startup container diagnostic regression
        run: python3 -W error::ResourceWarning .scratch/native-owner-recovery/startup-probe/test_observe.py -v
      - run: npm pack --dry-run
