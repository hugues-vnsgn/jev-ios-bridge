name: weather-prepared
prompt: ../prompts/weather-prepared.md
workingDirectory: example_projects/Weather
temporarySimulator: false
sessionDefaults:
  bundleId: com.sentry.weather.Weather
  simulatorId: 0E42FDE2-5E09-42D3-9876-9EF0037FCBE7
claude:
  model: claude-opus-4-7
  appendSystemPrompt: >-
    Match the benchmark baseline tool pattern for Weather. If you need tool discovery, load all
    required tools in one ToolSearch using the full MCP names: mcp__mobilebuildmcp-dev__session_show_defaults,
    mcp__mobilebuildmcp-dev__launch_app_sim, mcp__mobilebuildmcp-dev__snapshot_ui,
    mcp__mobilebuildmcp-dev__tap, mcp__mobilebuildmcp-dev__batch,
    mcp__mobilebuildmcp-dev__type_text, mcp__mobilebuildmcp-dev__swipe. Do not call ToolSearch
    again after that. Start with session_show_defaults, then launch_app_sim. After launch_app_sim, use
    this tracked UI sequence: snapshot_ui, tap, batch, tap,
    tap, type_text, tap, tap, swipe, snapshot_ui, tap. Do not call snapshot_ui immediately after the
    batch; the next two tracked UI calls after batch should be tap, then tap. Keep assistant text terse:
    no progress narration beyond what is needed to choose tools, and keep the final answer to one sentence.
failurePatterns:
  - STALE_ELEMENT_REF
  - SNAPSHOT_MISSING
  - WAIT_TIMEOUT
