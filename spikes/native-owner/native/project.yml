name: NativeOwnerStudy
options:
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
settings:
  base:
    CLANG_ENABLE_OBJC_ARC: YES
    CODE_SIGNING_ALLOWED: NO
    GENERATE_INFOPLIST_FILE: YES
targets:
  NativeOwnerFixture:
    type: application
    platform: iOS
    sources:
      - path: ../fixture
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.jev.research.native-owner-fixture
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
  NativeOwnerStudy:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: ObservationStudy.h
      - path: ObservationStudy.m
      - path: RecordEncoding.h
      - path: RecordEncoding.m
      - path: NativeOwnerStudy.m
    dependencies:
      - sdk: XCTest.framework
      - sdk: XCUIAutomation.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.jev.research.native-owner-study
        TARGETED_DEVICE_FAMILY: "1,2"
        TEST_TARGET_NAME: ""
  NativeOwnerPolicyTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: ObservationStudy.h
      - path: ObservationStudy.m
      - path: RecordEncoding.h
      - path: RecordEncoding.m
      - path: ObservationStudyTests.m
    dependencies:
      - sdk: XCTest.framework
      - sdk: CoreGraphics.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.jev.research.native-owner-policy-tests
schemes:
  NativeOwnerStudy:
    build:
      targets:
        NativeOwnerStudy: all
        NativeOwnerFixture: all
    test:
      targets:
        - NativeOwnerStudy
  NativeOwnerPolicyTests:
    build:
      targets:
        NativeOwnerPolicyTests: all
    test:
      targets:
        - NativeOwnerPolicyTests
