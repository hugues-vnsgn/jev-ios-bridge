name: FixtureApp
options:
  bundleIdPrefix: dev.jevbridge
settings:
  base:
    IPHONEOS_DEPLOYMENT_TARGET: '17.0'
    SWIFT_VERSION: '6.0'
    SWIFT_STRICT_CONCURRENCY: complete
    TARGETED_DEVICE_FAMILY: '1'
    CODE_SIGNING_ALLOWED: 'NO'
targets:
  FixtureApp:
    type: application
    platform: iOS
    sources: [Sources]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.jevbridge.fixture
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
schemes:
  FixtureApp:
    build:
      targets:
        FixtureApp: all
